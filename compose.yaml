services:
  gitarchive:
    image: ghcr.io/shadyhippo/git-account-ledger-backup:latest
    container_name: gitarchive
    restart: unless-stopped

    environment:
      TZ: America/New_York

      # --- EDIT THESE -------------------------------------------------------
      # One or more read-only PATs. Each token's account gets its own
      # directory under /data/sources/<login>/.
      GITHUB_RO_TOKENS: "PASTE_READ_ONLY_PAT_HERE"

      # Third-party repos or accounts you want archived. Optional.
      # A specific repo, or a whole owner, comma separated:
      # PUBLIC_REPOS: "someuser/SomethingInteresting"
      # PUBLIC_ACCOUNTS: "artcraft"

      # all | default | a comma separated list with globs, e.g. "main,release/*"
      BRANCH_POLICY: "all"
      # ---------------------------------------------------------------------

      # One full pass per night: backup, ledger, bundle (only if due), verify.
      # Set SCHEDULE_AT to "" to switch to the interval knobs below instead.
      SCHEDULE_AT: "03:15"
      RUN_ON_STARTUP: "1"

      # 0 disables the push-event ledger. It is an audit/undo convenience;
      # pinning and verification do not depend on it.
      LEDGER_INTERVAL: "900"

      # Bundles do not run nightly regardless of schedule: they do not
      # deduplicate, so one generation per month is the default.
      BUNDLE_INTERVAL: "2592000"
      BUNDLE_KEEP: "6"

      # Interval-mode only. Ignored while SCHEDULE_AT is set.
      BACKUP_INTERVAL: "3600"
      VERIFY_INTERVAL: "604800"

    volumes:
      # Point this at a share on the array (Use cache: no).
      - /mnt/user/gitarchive:/data
      # Optional per-source policies (see config.example.json). Mounted
      # read-only; tokens may live here instead of in the environment.
      # - /mnt/user/appdata/gitarchive/config.json:/config/config.json:ro

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

    # No ports. Outbound HTTPS only.
