# Deploy location on Tower:
#   /mnt/user/appdata/docker_projects/gitarchive/compose.yaml
#
# Backups are written to the array share:
#   /mnt/user/ghbackups

name: gitarchive

services:
  gitarchive:
    image: ghcr.io/shadyhippo/git-account-ledger-backup:latest
    container_name: gitarchive
    restart: unless-stopped

    environment:
      TZ: America/New_York

      # --- EDIT THIS ONE LINE -------------------------------------------------
      # Fine-grained PAT, "All repositories", Contents: Read-only.
      # Covers every ShadyHippo repo, public and private.
      GITHUB_RO_TOKENS: "PASTE_YOUR_READ_ONLY_PAT_HERE"
      # -----------------------------------------------------------------------

      # ArtCraft + the MS-Office equivalents (wordcraft/gridcraft/deckcraft)
      # and the rest of the Craft apps: ~7.2 GiB across 69 repos.
      PUBLIC_ACCOUNTS: "storytold"

      # Narrower alternative — swap PUBLIC_ACCOUNTS for this if you only want
      # the ArtCraft family and the three Office apps:
      # PUBLIC_REPOS: "storytold/artcraft,storytold/artcraftx,storytold/artcraft-services,storytold/craft-libs,storytold/craft-launcher,storytold/craft-launcher-assets,storytold/craft-common-actions,storytold/craft-fonts,storytold/craft-i18n,storytold/craft-ai-integrations,storytold/wordcraft,storytold/gridcraft,storytold/deckcraft"

      # One full pass per night: backup, ledger, bundle (if due), verify.
      SCHEDULE_AT: "03:15"
      RUN_ON_STARTUP: "1"

      # Bundle generations are full standalone copies. ~10 GiB each here,
      # so keep 3, not 6.
      BUNDLE_KEEP: "3"

      # 0 disables the push-event ledger. It is an audit/undo convenience;
      # pinning and verification do not depend on it.
      LEDGER_INTERVAL: "900"

      # Bundles never run nightly regardless of schedule.
      BUNDLE_INTERVAL: "2592000"

      # --- Notifications (optional; any one is enough) ----------------------
      # NTFY_URL: "https://ntfy.sh"
      # NTFY_TOPIC: "gitarchive"
      # ALERT_URL: "https://example.com/hook"
      # HEARTBEAT_URL: "https://hc-ping.com/YOUR-UUID"

    volumes:
      # Array share. Must be "Use cache: no" in Unraid.
      - /mnt/user/ghbackups:/data
      # Optional per-source policies. Leave commented unless you need them.
      # - /mnt/user/appdata/docker_projects/gitarchive/config.json:/config/config.json:ro

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g

    # No ports. Outbound HTTPS only.
